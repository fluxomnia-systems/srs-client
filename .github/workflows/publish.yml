name: Publish to crates.io

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.4.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Verify release tag
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag, package version, and main ancestry
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("Expected a stable release tag: vMAJOR.MINOR.PATCH")
          sha = subprocess.check_output(
              ["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"], text=True
          ).strip()
          subprocess.run(["git", "merge-base", "--is-ancestor", sha, "origin/main"], check=True)
          manifest = tomllib.loads(subprocess.check_output(
              ["git", "show", f"{sha}:Cargo.toml"], text=True
          ))
          package = manifest["package"]
          if package["name"] != "srs-client" or tag != f"v{package['version']}":
              raise SystemExit("Tag does not match the srs-client package version")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha={sha}\n")
          PY

  package:
    name: Validate release package
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: cargo test --all-targets
      - run: make lint
      - run: make cargo.fmt check=yes
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo publish --dry-run --locked

  live:
    name: SRS ${{ matrix.srs }} live contracts
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        srs: ["6.0.191", "7.0.162", "8.0.48"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run contract and live API tests
        env:
          SRS_IMAGE: ossrs/srs:${{ matrix.srs }}
          SRS_EXPECTED_VERSION: ${{ matrix.srs }}
        run: ./scripts/test-http-api.sh

  publish:
    name: Publish verified release
    needs: [resolve, package, live]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: cargo generate-lockfile
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish srs-client
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
